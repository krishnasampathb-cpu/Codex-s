<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title> 
</head>
<body>
    <h3>Registration Form</h3>
    <form action="register" method="post">
        <label for="name">Name: </label>
        <input type="text" id="name" name="name" placeholder="Enter Your Name" required><br><br>
        <label for="email">Email: </label>
        <input type="email" id="email" name="email" placeholder="Enter Your Email " required><br><br>
        <label for="password">Password:</label>
        <input type="" id="password" name="password" placeholder="Enter Your Password" required>
        <id="password" placeholder="enter your password"></id><br><br>
        <label for="dob">Date Of Birth:</label>
        <input type="date" id="dd/mm/yy" name="DOB"><br><br>
        <label for="Gender">Gender:</label>
        <label for="male">Male</label>
        <input type="radio" name="male"
        <label for="female">Female</label>
        <input type="radio" name="female" id="Female"><br><br>
        <label for="City">City:</label>
        <select name="city" id="city">
        <option
        value="Hyderabad">Hyderabad</option>
        <option value="Chennai">Chennai</option>
        <option value="Banglore">Banglore</option>
        <option value="Delhi">Delhi</option>
        </select><br><br>
        <input type="radio" name="Agree to Terms And Conditions" id="Agree To Terms And Conditions">
        <label for="aa">Agree To Terms And Conditions </label><br><br>
        
        <input type="submit" value="Submit">
    </form>

</body>
